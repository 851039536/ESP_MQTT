; PlatformIO 工程配置
;
; 注意：default_envs 是刻意设置的。native 环境（PC 上的单元测试）需要系统 gcc，
; 若不加 default_envs，`pio run` 会连 native 一起构建并因缺少 gcc 而失败。
; 见 AGENTS.md「关于引入单元测试」。

[platformio]
default_envs = esp-wrover-kit

[env:esp-wrover-kit]
platform = espressif32
board = esp-wrover-kit
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = knolleary/PubSubClient@^2.8

; PC 上运行的单元测试环境（不涉及硬件）。
; 需要系统 gcc 在 PATH 上；运行：pio test -e native
;
; 纯逻辑模块放在 lib/PureLogic/ 下：PlatformIO 会自动编译 lib/ 中的库，
; 且这些模块不依赖 Arduino，因此本环境不会碰到 WiFi.h / Arduino.h。
; （不要打开 test_build_src：那会把 src/main.cpp 一起拉进来，而它需要 Arduino 头文件。）
[env:native]
platform = native
test_framework = unity
build_flags =
    -std=gnu++11
    -I lib/PureLogic
